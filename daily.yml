name: 红利看板
on:
  schedule:
    - cron: "30 9 * * 1-5"   # UTC 09:30 = 新加坡 17:30（A股、港股、新加坡都已收盘）
  workflow_dispatch:          # 可在网页上手动点 Run workflow
permissions:
  contents: write             # 允许把每天的 data.json 存回仓库
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install akshare yfinance pyyaml requests
      - run: python build.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
          ALWAYS_SEND: ${{ vars.ALWAYS_SEND }}
          PAGE_URL:  https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - name: 保存数据
        run: |
          git config user.name  "dividend-bot"
          git config user.email "dividend-bot@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "数据更新 $(date -u +%F)"
          git push
