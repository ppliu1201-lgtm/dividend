<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三地红利看板</title>
<style>
:root{
  --bg:#f4f6fa; --card:#fff; --ink:#1d2433; --sub:#6b7486; --line:#e6e9f0; --soft:#f0f3f8;
  --brand:#2f6fde; --brand-soft:#e8f0fd;
  --up:#d63a3a; --down:#1f9d55;
  --good:#1f9d55; --good-soft:#e7f6ee; --bad:#d63a3a; --bad-soft:#fdecec; --warn:#c98a00; --warn-soft:#fdf5e1;
  --sg:#8a3ffc; --sg-soft:#f1e9ff;
  --shadow:0 1px 2px rgba(20,30,60,.05),0 2px 8px rgba(20,30,60,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0f1218; --card:#171b23; --ink:#e7eaf0; --sub:#8d96a8; --line:#262c38; --soft:#1e232d;
    --brand:#6a9cf5; --brand-soft:#1c2a44; --good-soft:#13291e; --bad-soft:#331a1c; --warn-soft:#2f2715; --sg:#b48cff; --sg-soft:#2a2040; --shadow:none; color-scheme:dark;}
}
:root[data-theme="dark"]{--bg:#0f1218; --card:#171b23; --ink:#e7eaf0; --sub:#8d96a8; --line:#262c38; --soft:#1e232d;
    --brand:#6a9cf5; --brand-soft:#1c2a44; --good-soft:#13291e; --bad-soft:#331a1c; --warn-soft:#2f2715; --sg:#b48cff; --sg-soft:#2a2040; --shadow:none; color-scheme:dark;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.bar{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-weight:700;font-size:17px;letter-spacing:.5px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:none;color:var(--sub);padding:6px 12px;border-radius:8px;font:inherit;cursor:pointer;text-decoration:none}
.tab.on{background:var(--brand);color:#fff}
.meta{margin-left:auto;color:var(--sub);font-size:12px}
main{max-width:1280px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:12px;box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:14px}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h2{margin:0;font-size:15px}
.card-b{padding:14px 16px}
.hint{color:var(--sub);font-size:12px}
.seg{display:flex;background:var(--soft);border-radius:8px;padding:2px;margin-left:auto}
.seg button{border:0;background:none;padding:4px 10px;border-radius:6px;font:inherit;font-size:12px;color:var(--sub);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.link{color:var(--brand);background:none;border:0;font:inherit;font-size:12px;cursor:pointer;padding:2px 0}

.tbl{width:100%;border-collapse:collapse}
.tw{overflow-x:auto}
.tbl th{font-weight:500;color:var(--sub);font-size:12px;text-align:right;padding:8px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 7px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl tr.row{cursor:pointer}
.tbl tr.row:hover td,.tbl tr.open td{background:var(--soft)}
.nm{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nm b{font-weight:600}
.code{color:var(--sub);font-size:12px}
.mk{font-size:10px;padding:0 4px;border-radius:4px;background:var(--brand-soft);color:var(--brand)}
.mk.HK{background:var(--warn-soft);color:var(--warn)}
.mk.SG{background:var(--sg-soft);color:var(--sg)}
.yrs{font-size:10px;color:var(--good);background:var(--good-soft);border-radius:4px;padding:0 4px}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--sub)}
.small{font-size:12px}
.yld{font-weight:600}
.yz{font-size:11px;padding:1px 6px;border-radius:4px;display:inline-block;margin-top:2px}
.yz.买入区{background:var(--good-soft);color:var(--good)}
.yz.减仓区{background:var(--bad-soft);color:var(--bad)}
.yz.持有区{background:var(--soft);color:var(--sub)}
.yld.买入区{color:var(--good)} .yld.减仓区{color:var(--bad)} .yld.持有区{color:var(--ink)}
.zones{display:inline-grid;grid-template-columns:repeat(3,auto);gap:3px}
.z{font-size:11px;padding:1px 5px;border-radius:4px;background:var(--soft);color:var(--sub)}
.z.上{background:var(--bad-soft);color:var(--bad)} .z.下{background:var(--good-soft);color:var(--good)}
.st{font-size:12px;padding:2px 8px;border-radius:10px;display:inline-block}
.st.持有观望{background:var(--warn-soft);color:var(--warn)}
.st.高位观察{background:var(--bad-soft);color:var(--bad)}
.st.低位机会{background:var(--good-soft);color:var(--good)}
.st.急跌中{background:var(--bad-soft,#fde8e8);color:var(--bad,#c53030)}
.pend{font-size:11px;color:var(--warn)}

.bb{width:108px;display:inline-block;text-align:left}
.bb .track{position:relative;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--good) 0 50%,var(--bad) 50% 100%);opacity:.75}
.bb .dot{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--ink);transform:translateX(-50%)}
.bb .lab{display:flex;justify-content:space-between;font-size:10px;color:var(--sub);margin-top:2px}

.detail td{padding:0 10px 14px;background:var(--soft);text-align:left;white-space:normal}
.dwrap{display:grid;gap:14px;padding-top:4px}
.dcols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.grid{display:flex;flex-wrap:wrap;gap:6px}
.gc{min-width:74px;padding:6px 8px;border-radius:8px;text-align:center;border:1px solid var(--line);background:var(--card)}
.gc .y{font-size:11px;font-weight:600;color:var(--brand)}
.gc .p{font-weight:600}
.gc .s{font-size:11px;color:var(--sub)}
.gc.buy{border-color:var(--good);background:var(--good-soft)}
.gc.buy .y{color:var(--good)}
.gc.sell{border-color:var(--bad);background:var(--bad-soft)}
.gc.sell .y{color:var(--bad)}
.kv{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--sub)}
.kv b{color:var(--ink);font-weight:600}
.sigs{display:flex;flex-wrap:wrap;gap:6px}
.sig{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--card);border:1px solid var(--line)}
svg.chart{display:block;width:100%;height:auto}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat{padding:14px 16px;margin:0}
.stat .l{color:var(--sub);font-size:12px}
.stat .v{font-size:20px;font-weight:700;margin-top:2px}
.stat .s{color:var(--sub);font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bars{padding:10px 16px 14px}
.brow{margin:9px 0}
.brow .t{display:flex;justify-content:space-between;gap:8px;font-size:12px}
.brow .b{position:relative;height:8px;background:var(--soft);border-radius:4px;margin-top:4px}
.brow .b i{display:block;height:100%;background:var(--brand);border-radius:4px}
.brow .b i.over{background:var(--bad)}
.brow .b .tg{position:absolute;top:-3px;width:2px;height:14px;background:var(--ink);opacity:.6}
.alloc input{width:64px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;font-size:12px;text-align:right}
.warnbox{border-radius:10px;padding:10px 14px;font-size:13px;margin:0 0 8px}
.warnbox.bad{background:var(--bad-soft);color:var(--bad)}
.warnbox.ok{background:var(--good-soft);color:var(--good)}
.empty{padding:36px 16px;text-align:center;color:var(--sub)}
.note{font-size:12px;color:var(--sub);padding:0 4px 24px}
.err{background:var(--bad-soft);color:var(--bad);padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:12px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.check:last-child{border-bottom:0}
.check input{margin-top:3px;width:16px;height:16px}
textarea{width:100%;min-height:110px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;resize:vertical}
ul.plain{margin:6px 0;padding-left:18px}
ul.plain li{margin:3px 0}

.boxbar{position:relative;width:170px;height:10px;border-radius:5px;background:var(--soft);display:inline-block;vertical-align:middle}
.boxbar .zb{position:absolute;top:0;bottom:0;background:var(--good);opacity:.35;border-radius:5px 0 0 5px}
.boxbar .zs{position:absolute;top:0;bottom:0;background:var(--bad);opacity:.35;border-radius:0 5px 5px 0}
.boxbar .dot{position:absolute;top:-3px;width:14px;height:14px;border-radius:50%;background:var(--card);border:2px solid var(--ink);transform:translateX(-50%)}
.boxbar .edge{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--sub)}
.boxlab{display:flex;justify-content:space-between;width:170px;font-size:10px;color:var(--sub);margin-top:3px}
.sw{font-size:12px;padding:2px 8px;border-radius:10px;display:inline-block;white-space:nowrap}
.sw.买入确认{background:var(--good);color:#fff}
.sw.买入区{background:var(--good-soft);color:var(--good)}
.sw.卖出区{background:var(--bad-soft);color:var(--bad)}
.sw.中部{background:var(--soft);color:var(--sub)}
.sw.跌破{background:var(--bad);color:#fff}
.sw.突破{background:var(--warn);color:#fff}
.newdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--bad);margin-left:4px;vertical-align:middle}
.fld select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{font-size:11px;color:var(--sub)}
dialog{border:0;border-radius:14px;padding:0;width:min(380px,92vw);background:var(--card);color:var(--ink);box-shadow:0 10px 40px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,15,25,.4)}
.dlg{padding:18px}
.dlg h3{margin:0 0 4px;font-size:16px}
.fld{display:block;margin:12px 0}
.fld span{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
.fld input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

@media (max-width:760px){
  header{position:static}
  .bar{gap:8px}
  .meta{margin-left:0;width:100%;font-size:11px}
  .stats{grid-template-columns:1fr 1fr}
  .two,.dcols{grid-template-columns:1fr}
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tr.row{padding:10px 14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);gap:8px 10px}
  .tbl tr.row td{padding:0;border:0;text-align:left;white-space:normal;background:none!important}
  .tbl tr.row td:first-child{grid-column:1/-1}
  .tbl tr.row td[data-l]::before{content:attr(data-l);display:block;font-size:11px;color:var(--sub)}
  .tbl tr.row td.hide-m{display:none}
  .tbl tr.open{background:var(--soft)}
  .detail td{padding:0 14px 14px}
  .bb{width:100%}
  .boxbar,.boxlab{width:100%}
}
.rt{display:inline-block;margin-left:4px;padding:0 5px;border-radius:5px;font-size:11px;font-weight:600;line-height:17px;background:color-mix(in srgb,var(--up,#d64545) 0%,transparent);border:1px solid var(--line);color:var(--sub)}
.rt.weak{color:#b7791f;border-color:#e8c27a}
.chk{display:inline-block;min-width:16px;text-align:center;font-weight:700}.chk.y{color:var(--down,#1f9d55)}.chk.n{color:var(--sub);opacity:.6}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo">三地红利看板</div>
    <nav class="tabs" id="tabs">
      <button class="tab" data-t="board">持仓看板</button>
      <button class="tab" data-t="low">低位观察</button>
      <button class="tab" data-t="swing">波段</button>
      <button class="tab" data-t="plan">计划</button>
      <button class="tab" data-t="alloc">配置</button>
      <button class="tab" data-t="review">周复盘</button>
      <a class="tab" href="backtest.html">回测</a>
      <a class="tab" href="fillstats.html">建仓统计</a>
    </nav>
    <div class="meta num" id="meta">加载中…</div>
  </div>
</header>
<main id="app"></main>

<dialog id="dlg"><form class="dlg" method="dialog">
  <h3 id="dlgTitle">编辑持仓</h3>
  <div class="hint">只保存在这台设备的浏览器里，不会上传。</div>
  <label class="fld"><span>持股数</span><input id="fShares" type="number" inputmode="decimal" min="0" step="1"></label>
  <label class="fld"><span id="fCostLab">成本价</span><input id="fCost" type="number" inputmode="decimal" min="0" step="0.001"></label>
  <label class="fld"><span>计划占比（这只股票最多占所在账户总资产的 %，建议 3–12）</span><input id="fPlan" type="number" inputmode="decimal" min="0" max="15" step="0.5"></label>
  <div class="hint" id="fPlanHint"></div>
  <label class="fld"><span>公司评级（季报后更新）：A+ 计划 ×1.2，A− 不变，B 及以下减半、跌破 250 日线暂停加仓</span><select id="fRating">
    <option value="">用默认</option><option value="A+">A+ 有分红 + 业绩增长</option><option value="A-">A− 有分红 + 业绩横盘</option>
    <option value="B">B 有分红 + 业绩下滑</option><option value="B-">B− 有分红 + 业绩差</option></select></label>
  <div class="acts">
    <button class="btn" value="clear">清除</button>
    <button class="btn" value="cancel">取消</button>
    <button class="btn pri" value="save">保存</button>
  </div>
</form></dialog>
<dialog id="sdlg"><form class="dlg" method="dialog">
  <h3 id="sTitle">记一笔波段</h3>
  <div class="hint">只记波段仓的买卖；底仓在“持仓看板”录入。保存在本机浏览器。</div>
  <div class="row2">
    <label class="fld"><span>方向</span><select id="sSide"><option value="buy">买入</option><option value="sell">卖出</option></select></label>
    <label class="fld"><span>日期</span><input id="sDate" type="date"></label>
  </div>
  <div class="row2">
    <label class="fld"><span id="sPriceLab">成交价</span><input id="sPrice" type="number" inputmode="decimal" min="0" step="0.001"></label>
    <label class="fld"><span>股数</span><input id="sShares" type="number" inputmode="decimal" min="0" step="1"></label>
  </div>
  <div class="acts">
    <button class="btn" value="cancel">取消</button>
    <button class="btn pri" value="save">保存</button>
  </div>
</form></dialog>
<input type="file" id="importFile" accept="application/json" hidden>

<script>
const KEY = "dividend-v2", OLDKEY = "dividend-holdings-v1";
const UNIT = {CNY:"¥", HKD:"HK$", SGD:"S$"};
const MKNAME = {A:"A", HK:"港", SG:"新"};
let DATA = null, TAB = "board", MKT = "all", OPEN = new Set(), editing = null;

/* ---------- 本地存储（持仓、现金、目标、复盘） ---------- */
function load(){
  let st = {};
  try { st = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e){}
  if (!st.holdings){
    st.holdings = {};
    try { st.holdings = JSON.parse(localStorage.getItem(OLDKEY) || "{}"); } catch(e){}
  }
  st.cash ??= 0; st.targets ??= null; st.reviews ??= {}; st.swings ??= []; st.plans ??= {}; st.planPct ??= {}; st.peak ??= {}; st.cashLog ??= []; st.aCash ??= 0; st.rating ??= {};
  return st;
}
let ST = load();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch(e){} };

const k = s => s.market + ":" + s.code;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f = (x, n=2) => x == null || isNaN(x) ? "-" : Number(x).toFixed(n);
const pf = s => s.price < 10 ? 3 : 2;                       // 新加坡低价股多保留一位
const money = x => x == null || isNaN(x) ? "-" : Math.round(x).toLocaleString("zh-CN");
const cur = s => UNIT[s.qccy];
const sgd = (v, s) => v * s.fx;
const sign = x => x > 0 ? "up" : x < 0 ? "down" : "muted";
const pctTxt = x => x == null ? "-" : (x > 0 ? "+" : "") + f(x) + "%";
const targets = () => ST.targets || DATA.targets || {};

function holding(s){
  const h = ST.holdings[k(s)];
  if (!h || !(h.shares > 0)) return null;
  const mv = h.shares * s.price;
  return { shares:h.shares, cost:h.cost, mv, mvS: sgd(mv, s),
           pnl: h.cost ? mv - h.shares*h.cost : null, pnlPct: h.cost ? (s.price/h.cost-1)*100 : null,
           div: h.shares * s.dps_net, divS: sgd(h.shares * s.dps_net, s),
           costYield: h.cost && s.dps_net ? s.dps_net / h.cost * 100 : null };
}
const filtered = () => DATA.stocks.filter(s => MKT === "all" || s.market === MKT);

/* ---------- 小组件 ---------- */
function nameCell(s){
  return `<div><div class="nm"><b>${esc(s.name)}</b><span class="mk ${s.market}">${MKNAME[s.market]}</span>${s.market==="HK"&&!s.tax?'<span class="yrs" title="香港本地公司，派息不扣税">0税</span>':""}${s.tag?`<span class="mk HK" title="利润随商品价格大起大落，分红也会变，仓位要小">${esc(s.tag)}</span>`:""}${ratingOf(s)?`<span class="rt ${weakR(s)?"weak":""}" title="公司评级：${RATING_TXT[ratingOf(s)]||""}${ST.rating[k(s)]?"（页面手动改）":s.rating_src?"（"+s.rating_src+(s.profit?"：利润"+s.profit.basis+" "+(s.profit.g>0?"+":"")+s.profit.g+"%":"")+"）":""}${ratingMul(s)!==1?"，计划仓位按 "+ratingMul(s)+" 倍":""}">${esc(ratingOf(s))}</span>`:""}${s.anomaly?'<span class="rt weak" title="股息率异常高：先看最近财报和分红公告，确认分红不会减再买">股息异常</span>':""}${s.dps_fwd?'<span class="rt weak" title="利润大跌，分红可能下调：按利润估算下一年分红约 '+s.dps_fwd+'">利润大跌</span>':""}</div>
    <div class="code num">${esc(s.code)} · ${esc(s.sector)}</div></div>`;
}
function priceCell(s){
  return `<div>${cur(s)}${f(s.price, pf(s))}</div><div class="small ${sign(s.chg)}">${pctTxt(s.chg)}</div>`;
}
function yieldCell(s){
  if (!(s.dps > 0)) return `<span class="pend">近一年无分红</span>`;
  const p = s.mode === "网格" ? `网格 · 税前 ${f(s.yield_gross)}%` : s.ypct != null ? `${s.win_years && s.win_years < 10 ? "近"+s.win_years+"年 " : ""}${s.ypct} 分位` : "历史不足";
  return `<div class="yld ${s.yzone} num">${f(s.yield)}%</div>
    <span class="yz ${s.yzone}">${s.yzone} · ${p}</span>`;
}
function bandCell(s){
  if (!s.buy_price) return "-";
  return `<div class="small num"><span class="down">买 ≤ ${f(s.buy_price, pf(s))}</span></div>
          <div class="small num"><span class="up">减 ≥ ${f(s.sell_price, pf(s))}</span></div>`;
}
function bbBar(s){
  const b = s.boll.w; if (!b) return "-";
  const [lo, mid, up] = b, span = up - lo || 1;
  const pos = Math.max(0, Math.min(100, (s.price - lo) / span * 100));
  const dLo = (s.price / lo - 1) * 100;
  return `<div class="bb"><div class="track"><span class="dot" style="left:${pos}%"></span></div>
    <div class="lab num"><span>${f(lo,pf(s))}</span><span>${f(mid,pf(s))}</span><span>${f(up,pf(s))}</span></div>

function yieldChart(s){
  const pts = s.yhist; if (!pts || pts.length < 10) return `<div class="hint">历史数据不足，暂不画股息率走势。</div>`;
  const W = 520, H = 150, L = 34, R = 8, T = 10, B = 22;
  const ys = pts.map(p=>p[1]).concat([s.yield_gross||0]);
  const mx = Math.max(...ys, s.y_buy||0) * 1.08, mn = 0;
  const X = i => L + i/(pts.length-1)*(W-L-R), Y = v => T + (1-(v-mn)/(mx-mn))*(H-T-B);
  const line = pts.map((p,i)=>`${X(i).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(" ");
  const hl = (v, c) => v==null ? "" : `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${c}" stroke-dasharray="4 3" stroke-width="1"/>`;
  const yrs = []; let last = "";
  pts.forEach((p,i)=>{ const y = p[0].slice(0,4); if (y!==last && i>0 && X(i)-(yrs.length?yrs[yrs.length-1][0]:0)>36){ yrs.push([X(i),y]); } last = y; });
  const ticks = [0, mx/2, mx].map(v=>`<text x="${L-4}" y="${Y(v)+3}" text-anchor="end" font-size="10" fill="var(--sub)">${f(v,1)}</text>`).join("");

function spark(arr){

/* ---------- 波段：记账（FIFO） ---------- */
function swingBook(){
  const byKey = {}, year = String(new Date().getFullYear());
  let ytdS = 0, ytdN = 0, allS = 0;
  const rows = [];
  ST.swings.slice().sort((a,b)=>a.date.localeCompare(b.date) || a.id.localeCompare(b.id)).forEach(t=>{
    const s = DATA.stocks.find(x=>k(x)===t.key);
    const b = byKey[t.key] ||= {lots:[], realized:0};
    let real = null;
    if (t.side === "buy"){ b.lots.push({q:t.shares, p:t.price}); b.nb = (b.lots.length === 1 ? 0 : (b.nb||0)) + 1; }
    else {
      let q = t.shares; real = 0;
      while (q > 0 && b.lots.length){
        const lot = b.lots[0], use = Math.min(q, lot.q);
        real += use * (t.price - lot.p); lot.q -= use; q -= use;
        if (lot.q <= 1e-9) b.lots.shift();
      }
      b.realized += real;
      if (!b.lots.length) b.nb = 0;
      const rS = s ? sgd(real, s) : 0; allS += rS;
      if (t.date.startsWith(year)){ ytdS += rS; ytdN++; }
    }
    rows.push({...t, s, real});
  });
  return {byKey, ytdS, ytdN, allS, trades: rows.reverse()};
}
function swingOpen(s){
  if (!ST.swings.length) return {shares:0, cost:0};
  const b = swingBook().byKey[k(s)];
  if (!b) return {shares:0, cost:0};
  const shares = b.lots.reduce((a,l)=>a+l.q,0), cost = b.lots.reduce((a,l)=>a+l.q*l.p,0);
  return {shares, cost, avg: shares ? cost/shares : null, realized: b.realized, nb: shares ? (b.nb||1) : 0};
}
function confirmDel(el){
  if (el.dataset.armed) return true;
  el.dataset.armed = "1"; el.textContent = "再点确认"; setTimeout(()=>{ if (el.isConnected){ delete el.dataset.armed; el.textContent = "删除"; } }, 3000);
  return false;
}

/* ---------- 滚动（波段仓主规则，借鉴吴富贵四条） ---------- */
const ROLL_LAB = ["日线到下轨", "周线中轨~下轨", "税后股息率≥5%", "在250日线上"];
/* 每笔 = 计划仓位 × 15%（波段仓 30% 分两笔） */
/* 每笔 = 计划仓位（底仓买满时）的 15%，波段仓最多 = 计划的 30%，分两笔。没有底仓也可以做。
   波段用计划之外的钱，不占单只 15% 上限 */
function rollLot(s){
  const plan = planS(s); if (!plan) return null;
  const n = roundLot(plan * 0.15 / s.fx / s.price, s.lot);
  return n > 0 ? {n, amt: n * s.price * s.fx} : {n: 0};
}
/* 止损时能不能转入底仓：A 级 + 股息率已到底仓某一档 + 底仓这一档还没买够 */
function canXfer(s, o){
  if (weakR(s) || !ratingOf(s) || !s.ladder || s.yield_gross == null) return null;
  const nb = s.ladder.buy.filter(l => s.yield_gross >= l.y - 1e-9).length; if (!nb) return null;
  const plan = planS(s); if (!plan) return null;
  const h = holding(s), inv = h ? (h.cost ? sgd(h.shares*h.cost, s) : h.mvS) : 0;
  const room = cumW(nb) * plan - inv;
  return room >= sgd(o.shares * s.price, s) * 0.8 ? {nb, room} : null;
}
function rollState(s){
  const R = s.roll, o = swingOpen(s);
  if (o.shares){
    if (R.wstop){ const x = canXfer(s, o);
      return x ? {cls:"买入区", t:"破250 · 转入底仓", why:`周线收盘跌破 250 日线。评级 ${ratingOf(s)}，股息率已到底仓第 ${x.nb} 档且底仓还没买够：把波段仓转入底仓，不卖`, xfer:true}
               : {cls:"跌破", t:"破250 · 卖", why:"周线收盘跌破 250 日线：卖出全部波段仓，底仓不动"}; }
    if (R.sell) return {cls:"卖出区", t:"到上轨 · 分批卖", why:"到周线上轨：先卖一半，再涨再卖剩下的"};
    if (R.stop) return {cls:"中部", t:"日线破250 · 盯周收盘", why:"今天收在 250 日线下，但止损看周线收盘（周五），不急着卖；不再加仓"};
    if (o.nb < 2 && R.add2){ const L = rollLot(s);
      return {cls:"买入确认", t:"可补第二笔", why:`再次碰到日线下轨、仍在 250 日线上：补第二笔${L&&L.n?`约 ${L.n.toLocaleString()} 股（${amt(s,L.amt)}）`:L?"（计划的 15% 不足一手：第一笔已买一手的，第二笔也买一手或跳过）":""}`}; }
    return {cls:"中部", t: o.nb >= 2 ? "两笔已满 · 等上轨" : "持有 · 等上轨", why:""};
  }
  if (R.buy){ const L = rollLot(s);
    return {cls:"买入确认", t:"买第一笔", why: L ? (L.n ? `买第一笔约 ${L.n.toLocaleString()} 股（${amt(s,L.amt)}，计划仓位的 15%）` : "计划仓位的 15% 不足一手：可以把两笔合成一手买，或跳过这只") : "填计划占比后算股数"}; }
  if (R.stop) return {cls:"跌破", t:"250日线下 · 不做", why:""};
  return {cls:"中部", t:`差 ${4-R.r.filter(Boolean).length} 条`, why:""};
}
/* 波段网格（A/H 股，吴富贵原帖）：波段仓 = 计划的 30%，税前 5% / 5.5% / 6% 各买 1/3，每份涨回 0.5 个点卖 */
const GB = () => ((DATA.defaults||{}).grid_buy || [5, 5.5, 6]).map(Number);
function gridSwingState(s){
  const plan = planS(s), sp = plan * 0.3, yg = s.yield_gross, o = swingOpen(s);
  const units = o.shares ? o.cost * s.fx : 0;               // 已投入（按成本，新币）
  const lv = GB(), nb = lv.filter(L => yg >= L - 1e-9).length;
  const allowed = lv.filter(L => yg > L - 0.5 + 1e-9).length;    // 5.5 / 5 / 4.5 之上才可以继续拿
  const lotV = sp / 3, wm = s.boll && s.boll.w ? s.boll.w[1] : null;
  let act = null;
  if (o.shares && units > allowed / 3 * sp + lotV * 0.5){
    const sell = roundLot(o.shares * (units - allowed / 3 * sp) / units, s.lot) || o.shares;
    act = {t:"卖", cls:"卖出区", n: Math.min(sell, o.shares), why:`股息率回到 ${f(lv[allowed] - 0.5,1)}% 以下：卖出 ${lv[allowed]}% 买的那份`};
  } else if (plan && nb && (!wm || s.price <= wm) && units < nb / 3 * sp - lotV * 0.5){
    const n = roundLot((nb / 3 * sp - units) / s.fx / s.price, s.lot);
    act = n > 0 ? {t:"买", cls:"买入确认", n, why:`税前股息率 ${f(yg)}% ≥ ${lv[nb-1]}%：波段建到 ${nb}/3`} : {t:"不足一手", cls:"中部", n:0, why:"这一格金额不足一手"};
  } else if (plan && nb && wm && s.price > wm && units < nb / 3 * sp - lotV * 0.5){
    act = {t:"等回中轨下", cls:"中部", n:0, why:`价格在周线中轨（约 ${f(wm,pf(s))}）上方，等回落`};
  }
  return {plan, sp, units, nb, allowed, act, o};
}

  return `<div class="card"><div class="card-h"><h2>波段网格（A 股 / H 股）</h2><span class="hint">吴富贵原帖网格：波段仓 = 计划仓位的 30%（计划之外的钱，没底仓也能做）。税前股息率 5% / 5.5% / 6% 各买 1/3，每份涨回 0.5 个点卖（6%→5.5%、5.5%→5%、5%→4.5%），跌回来再买。只在周线中轨下买。</span></div>

function xferToBase(id){
  const s = DATA.stocks.find(x=>k(x)===id), o = swingOpen(s); if (!o.shares) return;
  const h = ST.holdings[id] || {shares:0, cost:null};
  const newSh = (h.shares||0) + o.shares;
  // 波段那部分按今天价格计入底仓成本（盈亏已在波段记录里结算，避免重复算）
  const cost = h.cost && h.shares ? (h.shares*h.cost + o.shares*s.price) / newSh : (h.shares ? null : s.price);
  ST.swings.push({id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), key:id, side:"sell", xfer:true,
    date: todayStr(), price: s.price, shares: o.shares});
  ST.holdings[id] = {shares: newSh, cost: cost ? Math.round(cost*10000)/10000 : null};
  ST.peak[id] = Math.max(Number(ST.peak[id])||0, newSh);
  save(); render();
}

/* ---------- 分批建仓 / 减仓建议 ---------- */
const LADDER_W = {pyramid:[0.2,0.3,0.5], equal:[1/3,1/3,1/3], front:[0.5,0.25,0.25]};

function gate(s, nb){

/* 同一部分的买入额度：按股息率分位从高到低（最便宜的先）分配，不超过该部分目标和单只上限 */
let ALLOC = {};
const pairOf = s => DATA.stocks.find(x => x !== s && ((s.pair && x.code === s.pair) || (x.pair && x.pair === s.code)));
function computeAlloc(){
  const P = portfolio(), T = targets(), cap = (DATA.limits||{}).stock || 15, out = {}, byB = {};
  DATA.stocks.forEach(s=>{
    const L = s.ladder; if (!L || s.yield_gross == null) return;
    const g = gate(s, L.buy.filter(l => s.yield_gross >= l.y - 1e-9).length); if (!g.nb || g.wait) return;
    const nb = g.nb;

    const h = holding(s), inv = h ? (h.cost ? sgd(h.shares*h.cost, s) : h.mvS) : 0;
    const gap = cumW(nb) * plan - inv; if (gap <= 0) return;
    const deep = nb >= 2 ? Math.max(0, cumW(nb) * plan - Math.max(inv, cumW(1) * plan)) : 0;   // 第 2、3 档那部分，可动用现金垫
    const base = isA(s) ? P.a.total : P.total;
    let stockRoom = base ? cap/100 * base - (h ? h.mvS : 0) : gap;
    // 同一家公司的 A 股和 H 股合并算上限：两边市值合计 ≤ 两个账户总资产的 cap%
    const pr = pairOf(s);
    if (pr){ const ph = holding(pr), all = P.total + P.a.total;
      if (all > 0) stockRoom = Math.min(stockRoom, cap/100 * all - (h ? h.mvS : 0) - (ph ? ph.mvS : 0)); }
    (byB[s.bucket] ||= []).push({s, gap, stockRoom, deep});
  });
  Object.entries(byB).forEach(([b, list])=>{
    let room = b === "A股" ? P.a.cash : (T[b] != null ? Number(T[b])/100 * P.total - (P.byB[b]||0) : Infinity);
    list.sort((x,y)=>(y.s.ypct ?? -1) - (x.s.ypct ?? -1));
    list.forEach(({s, gap, stockRoom, deep})=>{
      let amt = Math.min(gap, Math.max(0, stockRoom)), why = amt < gap ? "单只上限" : "";
      if (amt > room){ amt = Math.max(0, room); why = b === "A股" ? "A股账户现金不够" : `“${b}”这部分额度已用完（先给了股息率分位更高的）`; }

  const used = Object.values(out).filter(o=>!o.A).reduce((a,o)=>a+o.amt, 0);

  const cashT = Number(T["现金"] ?? 15);

    .sort((x,y)=>((DATA.stocks.find(s=>k(s)===y[0])||{}).ypct ?? -1) - ((DATA.stocks.find(s=>k(s)===x[0])||{}).ypct ?? -1))
    .forEach(([id,o])=>{
      const add = Math.min(o.cap - o.amt, o.deep, extra); if (add <= 0) return;

    });

}

    const ex = byStock.find(x=>x[0]===s.name); if (ex) ex[1] += m; else byStock.push([s.name, m]);
  });
  const total = mv + cash;
  byB["现金"] = cash;
  let aMv = 0, aDiv = 0;
  DATA.stocks.filter(isA).forEach(s=>{ const h = holding(s); if (h){ aMv += h.mvS; aDiv += h.divS; } const o = swingOpen(s); if (o.shares) aMv += sgd(o.shares*s.price, s); });
  const aCash = (Number(ST.aCash) || 0) * (DATA.fx.CNY || 0.18);
  const a = {mv: aMv, cash: aCash, total: aMv + aCash, div: aDiv};
  return {held, cash, mv, total, cost, div, pnl: hasCost ? pnl : null, byB, bySec, byStock, a};
}
function checks(P){
  const L = DATA.limits || {}, T = targets(), out = [];
  if (!P.total) return out;
  P.byStock.forEach(([n,v])=>{ if (v/P.total*100 > (L.stock||15)) out.push(`${n} 占 ${f(v/P.total*100,1)}%，超过单只上限 ${L.stock||15}%`); });
  Object.entries(P.bySec).forEach(([n,v])=>{ if (v/P.total*100 > (L.sector||35)) out.push(`行业「${n}」占 ${f(v/P.total*100,1)}%，超过上限 ${L.sector||35}%`); });
  Object.entries(T).forEach(([b,t])=>{ const a = (P.byB[b]||0)/P.total*100; if (Math.abs(a-t) >= 5) out.push(`${b} 实际 ${f(a,1)}%，目标 ${t}%，${a>t?"超配":"低配"} ${f(Math.abs(a-t),1)} 个百分点`); });
  return out;
}

function weekKey(d = new Date()){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return `${t.getUTCFullYear()}-W${String(Math.ceil(((t-y0)/864e5+1)/7)).padStart(2,"0")}`;
}

$("#app").addEventListener("click", e=>{
  const m = e.target.closest("[data-m]"); if (m){ MKT = m.dataset.m; render(); return; }
  const lm = e.target.closest("[data-lm]"); if (lm){ ST.ladderMode = lm.dataset.lm; save(); render(); return; }
  const ed = e.target.closest("[data-edit]"); if (ed){ openEdit(ed.dataset.edit); return; }
  const sr = e.target.closest("[data-swrec]"); if (sr){ openSwing(sr.dataset.swrec); return; }
  const sx = e.target.closest("[data-swxfer]"); if (sx){ if (sx.dataset.armed){ xferToBase(sx.dataset.swxfer); } else { sx.dataset.armed = "1"; sx.textContent = "再点确认转入"; } return; }
  const sd = e.target.closest("[data-swdel]"); if (sd){ if (confirmDel(sd)) { ST.swings = ST.swings.filter(x=>x.id!==sd.dataset.swdel); save(); render(); } return; }
  if (e.target.closest("#exp")) return exportAll();
  if (e.target.closest("#imp")) return $("#importFile").click();
  if (e.target.closest("input,textarea,label")) return;
  const r = e.target.closest("tr.row[data-id]"); if (r){ const id = r.dataset.id; OPEN.has(id)?OPEN.delete(id):OPEN.add(id); render(); }
});
$("#app").addEventListener("change", e=>{
  const t = e.target;
  if (t.dataset.target != null){ ST.targets = {...targets(), [t.dataset.target]: Number(t.value)||0}; save(); render(); }
  else if (t.id === "aCashIn"){ ST.aCash = Number(t.value)||0; save(); render(); }
  else if (t.id === "cashIn"){ const v = Number(t.value)||0; ST.cash = v; const d = todayStr();
    if (ST.cashLog.length && ST.cashLog[ST.cashLog.length-1].date === d) ST.cashLog[ST.cashLog.length-1].cash = v; else ST.cashLog.push({date:d, cash:v});
    ST.cashLog = ST.cashLog.slice(-24); save(); render(); }
  else if (t.dataset.chk != null){ const wk = weekKey(); ST.reviews[wk].checks[+t.dataset.chk] = t.checked; save(); render(); }
});
$("#app").addEventListener("input", e=>{
  if (e.target.id === "note"){ ST.reviews[weekKey()].note = e.target.value; save(); }
});
function openEdit(id){
  const s = DATA.stocks.find(x=>k(x)===id); editing = s;
  const h = ST.holdings[id] || {};
  $("#dlgTitle").textContent = `${s.name} ${s.code}`;
  $("#fCostLab").textContent = `成本价（${s.qccy}）`;
  $("#fShares").value = h.shares ?? ""; $("#fCost").value = h.cost ?? ""; $("#fPlan").value = ST.planPct[id] ?? "";
  $("#fRating").value = ST.rating[id] || ""; $("#fRating").options[0].text = s.rating ? `用默认（${s.rating}）` : "用默认（未评级）";
  const PP = portfolio(), tot = isA(s) ? PP.a.total : PP.total;
  $("#fPlanHint").textContent = tot ? `按${isA(s)?"A股账户":"新币账户"}现在的总额 S$${money(tot)}：1% ≈ S$${money(tot/100)}。同一部分的候选股，计划合计可到目标的 3 倍（先到先得）` : `先在“配置”页填${isA(s)?"A股账户":""}现金余额，才能把占比换算成金额`;
  $("#dlg").returnValue = ""; $("#dlg").showModal();
}
$("#dlg").addEventListener("close", ()=>{
  const act = $("#dlg").returnValue, id = editing && k(editing);
  if (!id) return;
  if (act === "save"){
    const sh = parseFloat($("#fShares").value), c = parseFloat($("#fCost").value), pl = parseFloat($("#fPlan").value);
    if (sh > 0){ ST.holdings[id] = {shares: sh, cost: c > 0 ? c : null}; ST.peak[id] = Math.max(Number(ST.peak[id])||0, sh); }
    else { delete ST.holdings[id]; delete ST.peak[id]; }
    if (pl > 0) ST.planPct[id] = Math.min(pl, 15); else delete ST.planPct[id];
    const rt = $("#fRating").value; if (rt) ST.rating[id] = rt; else delete ST.rating[id];
  } else if (act === "clear"){ delete ST.holdings[id]; delete ST.peak[id]; }
  save(); render();
});
function exportAll(){
  const blob = new Blob([JSON.stringify(ST, null, 1)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `红利看板数据-${new Date().toISOString().slice(0,10)}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
$("#importFile").addEventListener("change", async e=>{
  const file = e.target.files[0]; if (!file) return;
  try {
    const v = JSON.parse(await file.text());
    if (v && typeof v === "object"){
      ST = v.holdings ? v : {holdings: v};           // 兼容旧版只有持仓的导出
      ST.cash ??= 0; ST.reviews ??= {}; ST.swings ??= []; ST.plans ??= {}; ST.planPct ??= {}; ST.peak ??= {}; ST.cashLog ??= []; save(); render();
    }
  } catch(_) { $("#meta").textContent = "导入失败：文件格式不对"; }
  e.target.value = "";
});

try { TAB = localStorage.getItem("dividend-tab") || "board"; } catch(_){}
if (!["board","low","swing","plan","alloc","review"].includes(TAB)) TAB = "board";
document.querySelectorAll("button.tab").forEach(b=>b.classList.toggle("on", b.dataset.t===TAB));
fetch("data.json?t=" + Date.now()).then(r=>r.json()).then(d=>{
  DATA = d;
  $("#meta").textContent = `数据日期 ${d.date} · 更新于 ${d.updated}（新加坡时间）`;
  render();
}).catch(()=>{ $("#meta").textContent = "数据加载失败"; $("#app").innerHTML = `<div class="card"><div class="empty">还没有数据。请先在 GitHub Actions 里运行一次“红利看板”。</div></div>`; });
</script>
</body>
