name: 红利回测
on:
  workflow_dispatch:
    inputs:
      years:
        description: "回测年数"
        default: "10"
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install akshare yfinance pyyaml requests numpy
      - run: python backtest.py
        env:
          YEARS: ${{ github.event.inputs.years }}
      - run: python fillstats.py
      - name: 保存报告
        run: |
          git config user.name  "dividend-bot"
          git config user.email "dividend-bot@users.noreply.github.com"
          git add docs/backtest.html docs/fillstats.html
          git diff --cached --quiet || git commit -m "回测与建仓统计 $(date -u +%F)"
          git push
