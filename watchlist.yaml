# ================= 三地红利看板 · 观察清单 =================
# 每只股票的字段（只有 code / market / name / sector 必填）：
#   code    : A股 6 位（600036）；港股 5 位（00941）；新加坡 SGX 代码（D05）
#   market  : A / HK / SG
#   sector  : 行业，用于行业占比和集中度检查
#   bucket  : 归入哪部分仓位（不填按 market：A股 / 港股 / 新加坡）
#   dps     : 每股年分红（税前，可选）。不填 = 自动用“近 12 个月实际分红”
#             预计今年分红会变时手动填（比如利润下滑），dps_ccy 写币种
#   tax     : 股息税率 %（可选，不填按 defaults）
#   pair    : 港股 H 股填对应 A 股代码，显示 AH 溢价
#   plan    : 计划触发（可选）price_le 现价≤X ；yield_ge 税后股息率≥Y
#   lot     : 每手股数（港股每只不同，填了建议股数会按手取整；新加坡、A股默认 100）
#   rating  : 公司评级（借鉴吴富贵）：A+ 有分红+业绩涨 / A- 有分红+业绩横盘 / B 有分红+业绩跌 / B- 有分红+业绩差
#             计划占比自动调整：A+ ×1.2 / A- 不变 / B、B- 减半；B 及以下跌破 250 日线时暂停第 2、3 档。季报后更新（网页上也能临时改）
#   tag     : 标签，显示在名字旁边（比如“周期”：利润随商品价格大起大落，分红也会跟着变，仓位要小）
#
# 买卖区规则（默认）：
#   用每只股票过去 10 年的股息率分布 ——
#   当前股息率处于自己历史的高 20%（≥80 分位）= 买入区；低 20%（≤20 分位）= 减仓区
#   历史不足 3 年的股票，改用下面固定的 buy_yield / sell_yield（税后）

defaults:
  hist_years: 10       # 算分位用最近几年；估值体系 2021 年前后“换挡”的股票在该行写 hist_years: 5
  buy_pct: 80          # 股息率历史分位 ≥ 80 为买入区（分批：第1档=中位数，第2档=80分位，第3档=90分位）
  sell_pct: 20         # 股息率历史分位 ≤ 20 为减仓区
  floor_net: 4.5       # 股息率底线：第1档税后股息率不低于此值（借鉴吴富贵“5% 起买”，这里取 4.5 兼顾新加坡、香港本地股）
  roll_min_net: 5.0    # 滚动（波段仓）要求税后股息率 ≥ 5%
  roll_holding: []     # 正在做滚动波段的股票代码，例如 ["00728", "D05"]。第二笔 / 卖出 / 止损邮件只发给这些（看板“波段”页会列出该填的代码）
  buy_yield: 5.0       # 历史不足时的备用规则（税后）
  sell_yield: 4.0
  boll_near_pct: 3.0   # 距周线布林下轨 ≤ 3% 算低位
  tax_a: 0             # A股在内地账户（东方财富）长期持有 >1 年：0%（1个月-1年 10%）
  tax_hk: 10           # H股 / 红筹（新加坡券商）
  tax_sg: 0            # 新加坡股票和 REIT：0

  # 波段（区间高抛低吸），只用于“波段仓”，底仓仍按股息率网格
  swing:
    enabled: true
    sleeve: 30            # 波段仓占该股计划仓位 %
    windows: [160, 120, 90, 60]   # 识别区间时依次尝试的交易日长度，取最长满足的
    min_width: 8          # 区间宽度 % 下限（太窄扣完费用没空间）
    max_width: 30         # 上限（太宽就不是横盘）
    max_bandwidth: 20     # 周线布林带宽度 % 上限
    zone_pct: 20          # 区间下 20% 为波段买入区，上 20% 为卖出区
    stop_pct: 1.5         # 收盘跌破下沿 1.5% 止损；突破上沿 1.5% 停止波段
    fee_roundtrip: 0.4    # 一买一卖费用 %
  # 某只股票想手动画区间：在那一行加 swing_box: {lo: 4.05, hi: 4.85}
  # 某只股票不做波段：在那一行加 swing: false

# 目标仓位（%），网页“配置”页可以改，改了只存在你的浏览器
targets:
  现金: 15
  新加坡: 50
  港股: 35
  A股: 0     # A股用内地账户的另一笔资金，不计入这 10 万新币

# 集中度上限（%）
limits:
  stock: 15
  sector: 35
  cash_min: 8          # 第 2、3 档可以动用现金垫，但新币账户现金最少留 8%

# ================= 股票池选股标准 =================
# 1. 大中盘、成交活跃，买卖不难
# 2. 连续派息：公司 ≥ 8 年、REIT ≥ 5 年；近 5 年没有大幅削减分红（周期股除外，已标“周期”）
# 3. 分红可持续：非 REIT 派息比例一般 ≤ 80%；REIT 负债率 ≤ 约 40%
# 4. 行业分散：每个行业 2–4 只备选，复盘时按“股息率分位 + 周线位置”在同行业里挑最便宜的
# 5. 不收：内房开发商、高负债小盘股、已退市/私有化的（如恒生银行，2026-01 已退市）
# 这是观察池，不是买入清单：只有进入买入区、并且分红没有问题的，才按分批计划买

